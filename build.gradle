plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.19'
}

version = '1.0.0'
group = 'com.example.rainfog'

base {
    archivesName = 'rainfog'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    // Se quiser, troque pela versão 21.1.x mais recente
    version = '21.1.172'

    runs {
        client {
            client()
        }
    }

    mods {
        rainfog {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
